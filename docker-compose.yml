version: '3.8'

services:
  # ============ Бэкенд ============
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      args:
        BACKEND_VERSION: ${BACKEND_VERSION:-1.0.0}
    container_name: momo-backend
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      - PORT=${BACKEND_PORT:-8081}
    networks:
      - momo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8081}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============ Фронтенд ============
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-production}
      args:
        - FRONTEND_PORT=${FRONTEND_PORT:-80}
        - BACKEND_PORT=${BACKEND_PORT:-8081}
    container_name: momo-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8081}
      - FRONTEND_PORT=${FRONTEND_PORT:-80}
      - NODE_ENV=${NODE_ENV:-production}
      - VUE_APP_API_URL=http://localhost:${BACKEND_PORT-8081}
    networks:
      - momo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FRONTEND_PORT:-80}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  momo-network:
    driver: bridge
    name: momo-network