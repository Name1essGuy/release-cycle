version: '3.8'

services:
  # ============ Бэкенд ============
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      args:
        BACKEND_VERSION: ${BACKEND_VERSION:-1.0.0}
    container_name: momo-backend
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      - PORT=${BACKEND_PORT:-8081}
    networks:
      - momo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8081}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============ Сборка и загрузка статики в S3 ============
  frontend-uploader:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      target: uploader
      args:
        - VUE_APP_API_URL=${VUE_APP_API_URL:-/api}
        - VUE_APP_VERSION=${VUE_APP_VERSION:-1.0.0}
    container_name: momo-frontend-uploader
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://storage.yandexcloud.net}
      - S3_PREFIX=${S3_PREFIX:-momo-store}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ru-central1}
    profiles:
      - deploy

networks:
  momo-network:
    driver: bridge
    name: momo-network