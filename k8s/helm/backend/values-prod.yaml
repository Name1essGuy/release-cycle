# Overrides for production environment

replicaCount: 1

image:
  tag: 1.1.0
  pullPolicy: Always

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

env:
  - name: NODE_ENV
    value: "production"
  - name: DATABASE_URL
    value: "postgres://user:pass@postgres-prod:5432/db"

configmap:
  data:
    LOG_LEVEL: "warn"

ingress:
  enabled: true
  hosts:
    - host: backend.example.com
      paths:
        - path: /api
          pathType: Prefix

secret:
  enabled: true
  # data:
  #   JWT_SECRET: "base64-encoded-value-from-vault"