# Overrides for staging environment

replicaCount: 2

image:
  tag: 1.1.0

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

env:
  - name: NODE_ENV
    value: "staging"
  - name: DATABASE_URL
    value: "postgres://user:pass@postgres-staging:5432/db"

configmap:
  data:
    LOG_LEVEL: "info"

ingress:
  enabled: true
  hosts:
    - host: backend.staging.example.com
      paths:
        - path: /api
          pathType: Prefix