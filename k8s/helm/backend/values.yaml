# Default values for backend

replicaCount: 1

image:
  repository: cr.yandex/crpcti5ji1nf9q4ofu6j/backend
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ycr-secret

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: backend.local
      paths:
        - path: /api
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: NODE_ENV
    value: "production"
  - name: DATABASE_URL
    value: "postgres://user:pass@postgres:5432/db"

configmap:
  enabled: true
  data:
    LOG_LEVEL: "info"
    API_PORT: "8080"

secret:
  enabled: false
  # data:
  #   JWT_SECRET: "base64-encoded-value"

probes:
  liveness:
    enabled: true
    path: /health
    port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: true
    path: /health
    port: 8081
    initialDelaySeconds: 5
    periodSeconds: 5