# Overrides for dev environment

replicaCount: 1

image:
  tag: dev-latest

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  - name: NODE_ENV
    value: "development"
  - name: API_URL
    value: "http://backend-dev:8080/api"

configmap:
  data:
    API_BASE_URL: "/api"

ingress:
  enabled: true
  hosts:
    - host: frontend.dev.local
      paths:
        - path: /
          pathType: Prefix