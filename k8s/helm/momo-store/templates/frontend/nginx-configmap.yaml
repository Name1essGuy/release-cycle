{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "momo-store.fullname" . }}-frontend-nginx
  labels:
    app: frontend
    {{- include "momo-store.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.service.port }};
        server_name _;

        resolver {{ .Values.frontend.dnsResolver }} valid=30s ipv6=off;

        set $s3_host "{{ .Values.frontend.s3.endpoint }}";
        set $s3_bucket "{{ .Values.frontend.s3.bucket }}";
        set $s3_prefix "{{ .Values.frontend.s3.prefix }}";

        # ====================================================================
        # Health check для probes — не ходит в S3, отвечает всегда
        # ====================================================================
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ====================================================================
        # Корень — index.html из папки momo-store/
        # ====================================================================
        location = / {
            proxy_pass https://$s3_host/$s3_bucket/$s3_prefix/index.html;
            proxy_set_header Host $s3_host;
            proxy_ssl_server_name on;
        }

        # ====================================================================
        # Статика — префикс momo-store уже в $request_uri
        # ====================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            proxy_pass https://$s3_host/$s3_bucket$request_uri;
            proxy_set_header Host $s3_host;
            proxy_ssl_server_name on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ====================================================================
        # SPA-роутинг
        # ====================================================================
        location / {
            proxy_pass https://$s3_host/$s3_bucket$request_uri;
            proxy_set_header Host $s3_host;
            proxy_ssl_server_name on;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        # ====================================================================
        # Fallback для Vue Router
        # ====================================================================
        location @spa_fallback {
            proxy_pass https://$s3_host/$s3_bucket/$s3_prefix/index.html;
            proxy_set_header Host $s3_host;
            proxy_ssl_server_name on;
        }
    }
{{- end }}