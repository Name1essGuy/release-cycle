{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "momo-store.fullname" . }}-frontend-nginx
  labels:
    app: frontend
    {{- include "momo-store.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user nginx;
    worker_processes 1;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        sendfile on;
        keepalive_timeout 65;
        include /etc/nginx/conf.d/*.conf;
    }

  default.conf: |
    server {
        listen {{ .Values.frontend.service.port }};
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ include "momo-store.fullname" . }}-backend:{{ .Values.backend.service.port }}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://{{ include "momo-store.fullname" . }}-backend:{{ .Values.backend.service.port }}/health;
        }

        location /metrics {
            proxy_pass http://{{ include "momo-store.fullname" . }}-backend:{{ .Values.backend.service.port }}/metrics;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
{{- end }}