{{- if and .Values.monitoring .Values.monitoring.enabled .Values.monitoring.dashboard .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "momo-store.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "momo-store.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  momo-store-overview.json: |
    {
      "title": "Momo Store — Overview",
      "uid": "momo-store-overview",
      "tags": ["momo-store", "red"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Traffic — Requests per second by handler",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(response_timing_ms_count{namespace=\"{{ .Release.Namespace }}\"}[5m])) by (handler)",
              "legendFormat": "{{ "{{handler}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "title": "Latency — p50 / p95 / p99",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(response_timing_ms_bucket{namespace=\"{{ .Release.Namespace }}\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(response_timing_ms_bucket{namespace=\"{{ .Release.Namespace }}\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(response_timing_ms_bucket{namespace=\"{{ .Release.Namespace }}\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 3,
          "title": "Total request rate",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(response_timing_ms_count{namespace=\"{{ .Release.Namespace }}\"}[5m]))",
              "legendFormat": "req/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 4,
          "title": "Backend pods ready",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(kube_pod_status_ready{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "momo-store.fullname" . }}-backend-.*\",condition=\"true\"} == 1)",
              "legendFormat": "ready"
            }
          ]
        },
        {
          "id": 5,
          "title": "Frontend pods ready",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(kube_pod_status_ready{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "momo-store.fullname" . }}-frontend-.*\",condition=\"true\"} == 1)",
              "legendFormat": "ready"
            }
          ]
        }
      ]
    }

  momo-store-business.json: |
    {
      "title": "Momo Store — Business",
      "uid": "momo-store-business",
      "tags": ["momo-store", "business"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Orders per minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(orders_count{namespace=\"{{ .Release.Namespace }}\"}[5m]) * 60",
              "legendFormat": "orders/min"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 2,
          "title": "Total orders (last 24h)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "increase(orders_count{namespace=\"{{ .Release.Namespace }}\"}[24h])",
              "legendFormat": "orders"
            }
          ]
        },
        {
          "id": 3,
          "title": "Top-10 dumplings by requests",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "topk(10, rate(dumplings_listing_count{namespace=\"{{ .Release.Namespace }}\"}[5m]))",
              "legendFormat": "id={{ "{{id}}" }}"
            }
          ]
        }
      ]
    }

  momo-store-infrastructure.json: |
    {
      "title": "Momo Store — Infrastructure",
      "uid": "momo-store-infrastructure",
      "tags": ["momo-store", "infra"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "CPU usage (cores) by pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "momo-store.fullname" . }}-.*\",container!=\"POD\"}[5m])) by (pod)",
              "legendFormat": "{{ "{{pod}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 2,
          "title": "Memory usage (MiB) by pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "momo-store.fullname" . }}-.*\",container!=\"POD\"}) by (pod) / 1024 / 1024",
              "legendFormat": "{{ "{{pod}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "MiB" } }
        },
        {
          "id": 3,
          "title": "Pod restarts (last 1h)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "momo-store.fullname" . }}-.*\"}[1h])) by (pod)",
              "legendFormat": "{{ "{{pod}}" }}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Network RX/TX (MiB/s)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "momo-store.fullname" . }}-.*\"}[5m])) by (pod) / 1024 / 1024",
              "legendFormat": "rx {{ "{{pod}}" }}"
            },
            {
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "momo-store.fullname" . }}-.*\"}[5m])) by (pod) / 1024 / 1024",
              "legendFormat": "tx {{ "{{pod}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "MiB" } }
        }
      ]
    }
{{- end }}