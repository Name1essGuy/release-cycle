{{- if and .Values.monitoring .Values.monitoring.enabled .Values.monitoring.serviceMonitor .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "momo-store.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "momo-store.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.releaseLabel | default "monitoring" }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
{{- end }}